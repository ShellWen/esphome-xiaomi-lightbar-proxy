# Full working example for the xiaomi_lightbar external component.
#
# Replace the wifi credentials and the `serial:` values with your own. To find a
# remote's serial, flash this config, press/turn the remote, and watch the logs
# for a line like:
#   [I][xiaomi_lightbar]: Action from unknown serial 0x7B7E12 (command 0x01). ...

esphome:
  name: xiaomi-lightbar

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

external_components:
  - source:
      type: git
      url: https://github.com/ShellWen/esphome-xiaomi-lightbar-proxy
      ref: main
    components: [xiaomi_lightbar]

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO7
  miso_pin: GPIO5

xiaomi_lightbar:
  id: lightbar_hub
  cs_pin: GPIO10
  ce_pin: GPIO4
  data_rate: 1MHz
  pa_level: LOW
  channel: 68
  tx_repeats: 20
  tx_interval: 10ms

light:
  - platform: xiaomi_lightbar
    name: "Monitor Light Bar"
    xiaomi_lightbar_id: lightbar_hub
    serial: 0xABCDEF

event:
  - platform: xiaomi_lightbar
    name: "Light Bar Remote"
    xiaomi_lightbar_id: lightbar_hub
    serial: 0x123456
    forward_to: 0xABCDEF
    device_class: button
    on_press:
      then:
        - logger.log: "Remote: press"
    on_turn_clockwise:
      then:
        - logger.log: "Remote: clockwise"
    on_turn_counterclockwise:
      then:
        - logger.log: "Remote: counter-clockwise"
    on_hold:
      then:
        - logger.log: "Remote: hold"

button:
  - platform: xiaomi_lightbar
    name: "Light Bar Pair"
    xiaomi_lightbar_id: lightbar_hub
    serial: 0xABCDEF
    type: pair
  - platform: xiaomi_lightbar
    name: "Light Bar Resync State"
    xiaomi_lightbar_id: lightbar_hub
    serial: 0xABCDEF
    type: toggle_internal_state

